<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sri Lanka Smart Todo - A simple, clean, and professional personal task manager with offline localStorage persistence, dashboard metrics, and a beautiful responsive UI.">
    <title>Sri Lanka Smart Todo - My Tasks</title>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <span class="nav-logo-icon">✓</span>
                <span>Smart Todo</span>
            </a>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="todo.html" class="nav-link active">Todo</a></li>
                <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li><a href="about.html" class="nav-link">About</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        
        <section id="todoSection" class="site-section">
            <div class="todo-container">
                <header class="todo-header">
                    <h2>My Tasks</h2>
                    <p>Add your tasks and stay productive every day.</p>
                </header>

                <div class="todo-input">
                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What do you need to do?"
                    >
                    <button id="addTaskBtn" class="btn btn-primary">Add Task</button>
                </div>

                <div class="todo-bar">
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="active">Active</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                    <span id="taskCount" class="task-info-text">0 tasks remaining</span>
                </div>

                <ul id="taskList"></ul>
            </div>
        </section>

    </main>

    <!-- Global Footer -->
    <footer class="site-footer">
        <p>Sri Lanka Smart Todo | DevOps Team Assignment</p>
    </footer>

    <script src="scripts/app.js"></script>
    <script>
        // Simple Mobile Navigation menu toggle
        const navToggle = document.getElementById("navToggle");
        const navLinks = document.getElementById("navLinks");
        if (navToggle) {
            navToggle.addEventListener("click", () => {
                navLinks.classList.toggle("active");
            });
        }
    </script>
</body>
</html>
